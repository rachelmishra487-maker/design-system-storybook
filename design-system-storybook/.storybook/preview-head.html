<!-- Google Analytics 4 (GA4) Tracking for Storybook Navigation -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MEASUREMENT_ID"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const GA_MEASUREMENT_ID = window.VITE_GA4_MEASUREMENT_ID || 'G-MEASUREMENT_ID';
  gtag('config', GA_MEASUREMENT_ID, {
    send_page_view: true,
    page_title: document.title,
    page_location: window.location.href
  });

  // Track Storybook story navigation via hashchange & popstate event listeners
  function trackStoryNavigation(eventType) {
    const currentUrl = window.location.href;
    const storyId = window.location.hash || window.location.search;
    console.log('[GA4 Tracker] Event:', eventType, '| Story URL:', currentUrl);
    
    gtag('event', 'page_view', {
      page_title: document.title || 'Storybook Component Viewer',
      page_location: currentUrl,
      page_path: window.location.pathname + storyId,
      navigation_type: eventType
    });

    gtag('event', 'storybook_story_view', {
      story_path: storyId,
      timestamp: new Date().toISOString()
    });
  }

  window.addEventListener('hashchange', function() {
    trackStoryNavigation('hashchange');
  });

  window.addEventListener('popstate', function() {
    trackStoryNavigation('popstate');
  });
</script>
